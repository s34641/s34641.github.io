 <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Praew Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #e0f2fe 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-slate-700 flex flex-col min-h-screen">

    <!-- บรรทัดแรก: โค้ดที่ไปหน้าทุกๆ หน้าได้ -->
    <header class="bg-white/90 backdrop-blur-md shadow-xs py-4 px-6 text-center sticky top-0 z-50 border-b border-pink-100">
        <nav class="flex flex-wrap justify-center gap-3 md:gap-6 text-sm md:text-base font-medium">
            <a href="index.html" class="text-pink-600 font-bold bg-pink-50 px-3.5 py-1.5 rounded-full border border-pink-200">หน้าแรก</a>
            <a href="about.html" class="hover:text-pink-500 transition px-3.5 py-1.5">เกี่ยวกับฉัน</a>
            <a href="performance.html" class="hover:text-pink-500 transition px-3.5 py-1.5">ผลงาน</a>
            <a href="contact.html" class="hover:text-pink-500 transition px-3.5 py-1.5">ติดต่อ</a>
        </nav>
    </header>

    <!-- เนื้อหาหลักหน้าแรก -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center">
        
        <!-- บรรทัดต่อมา: 🏮 ยินดีต้อนรับสู่แฟ้มสะสมผลงาน เป็นที่ใส่รูปภาพ 1 รูป สไตล์วงกลม -->
        <h2 class="text-xl md:text-2xl font-bold text-pink-600 mb-6">🏮 ยินดีต้อนรับสู่แฟ้มสะสมผลงาน</h2>
        
        <div class="w-40 h-40 md:w-48 md:h-48 rounded-full overflow-hidden border-4 border-pink-300 shadow-xl bg-white mb-6">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Praew Profile" class="w-full h-full object-cover">
        </div>

        <!-- บรรทัดต่อมา: สวัสดีค่ะ -->
        <h3 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">สวัสดีค่ะ</h3>

        <!-- บรรทัดต่อมา: ดิฉัน นางสาววราลี อาจชัยสงฆ์ -->
        <p class="text-lg md:text-xl font-semibold text-pink-600 mb-2">ดิฉัน นางสาววราลี อาจชัยสงฆ์</p>

        <!-- บรรทัดต่อมา: นี่คือพอร์ต Portfolio ของดิฉันค่ะ รวบรวมผลงาน ความสามารถ และเรื่องราวต่างๆ ไว้ที่นี่ค่ะ 🙇🏻‍♀️ -->
        <p class="text-slate-600 max-w-md text-sm md:text-base mb-8">
            นี่คือพอร์ต Portfolio ของดิฉันค่ะ รวบรวมผลงาน ความสามารถ และเรื่องราวต่างๆ ไว้ที่นี่ค่ะ 🙇🏻‍♀️
        </p>

        <!-- บรรทัดต่อมา: เป็นโค้ดให้ไป about -->
        <div>
            <a href="about.html" class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-8 py-3 rounded-full shadow-lg shadow-pink-200 transition inline-flex items-center gap-2">
                ไปยังหน้าเกี่ยวกับฉัน &rarr;
            </a>
        </div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-pink-100/50">
        &copy; 2026 Praew Portfolio. All rights reserved. 🌸
    </footer>
</body>
</html>
